<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="16" fill="url(#bg)" />
  <rect width="1200" height="440" rx="16" fill="url(#grid-pattern)" />
  <rect width="1200" height="440" rx="16" fill="url(#cyan-glow)" />
  <rect width="1200" height="440" rx="16" fill="url(#purple-glow)" />
  <rect x="1.5" y="1.5" width="1197" height="437" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Left Content -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SOFTWARE ENGINEERING STUDENT &amp; DEVELOPER</text>
  </g>

  <text x="60" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="url(#title-color)" letter-spacing="-1.5">Bilal Tariq</text>

  <text x="60" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#cbd5e1">Full Stack Developer | AI &amp; Flutter Specialist</text>

  <text x="60" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8" font-weight="400">Architecting scalable web backends, intelligent NLP screening engines,</text>
  <text x="60" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94a3b8" font-weight="400">and seamless cross-platform mobile apps focused on security and clean code.</text>

  <g transform="translate(60, 288)">
    <rect x="0" y="0" width="92" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="46" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Flutter</text>

    <rect x="104" y="0" width="92" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="150" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">MERN</text>

    <rect x="208" y="0" width="92" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="254" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Python</text>

    <rect x="312" y="0" width="92" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="358" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">Flask</text>

    <rect x="416" y="0" width="92" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="462" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Docker</text>
  </g>

  <g transform="translate(60, 362)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">LOCATION: Islamabad, Pakistan | EDUCATION: COMSATS University Islamabad</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#38bdf8">STATUS: Open to Backend, Full Stack &amp; Mobile Engineering Roles</text>
  </g>

  <!-- Right Code Terminal -->
  <g transform="translate(760, 48)">
    <rect x="0" y="0" width="380" height="344" rx="14" fill="#0b1329" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1.5" />
    <rect x="0" y="0" width="380" height="36" rx="14" fill="#0f172a" fill-opacity="0.9" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.85" />
    <text x="76" y="22" font-family="monospace" font-size="12" fill="#64748b" font-weight="600">bilal_profile.config.ts</text>

    <g transform="translate(20, 56)">
      <text x="0" y="20" font-family="monospace" font-size="13" fill="#8b5cf6">export const <tspan fill="#38bdf8">engineer</tspan> = {</text>
      <text x="18" y="46" font-family="monospace" font-size="12.5" fill="#94a3b8">name: <tspan fill="#10b981">'Bilal Tariq'</tspan>,</text>
      <text x="18" y="70" font-family="monospace" font-size="12.5" fill="#94a3b8">degree: <tspan fill="#10b981">'BSE @ COMSATS'</tspan>,</text>
      <text x="18" y="94" font-family="monospace" font-size="12.5" fill="#94a3b8">specialities: [</text>
      <text x="36" y="118" font-family="monospace" font-size="12.5" fill="#f59e0b">'Full-Stack Web'</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="142" font-family="monospace" font-size="12.5" fill="#f59e0b">'Flutter Apps'</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="166" font-family="monospace" font-size="12.5" fill="#f59e0b">'AI &amp; NLP Systems'</tspan></text>
      <text x="18" y="190" font-family="monospace" font-size="12.5" fill="#94a3b8">],</text>
      <text x="18" y="214" font-family="monospace" font-size="12.5" fill="#94a3b8">coreStack: [<tspan fill="#38bdf8">'Python'</tspan>, <tspan fill="#38bdf8">'Dart'</tspan>, <tspan fill="#38bdf8">'MERN'</tspan>],</text>
      <text x="18" y="238" font-family="monospace" font-size="12.5" fill="#94a3b8">certification: <tspan fill="#10b981">'Kaggle SQL'</tspan>,</text>
      <text x="0" y="264" font-family="monospace" font-size="13" fill="#8b5cf6">};</text>
    </g>

    <g transform="translate(20, 298)">
      <rect x="0" y="0" width="340" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">STATUS: Open to Backend &amp; Full-Stack Roles</text>
