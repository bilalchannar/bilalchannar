name: Markdown Validation & Link Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Markdown Links
        uses: garthk/link-check-action@v1
        with:
          sub-directory: '.'
          file-path: 'README.md'
